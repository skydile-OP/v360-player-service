<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>360° Ultra-HD Diamond & Jewelry Viewer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1a2336 0%, #080c14 100%);
      cursor: grab;
    }
    #container:active {
      cursor: grabbing;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    
    /* Top Header Bar */
    .top-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .stone-tag {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .quality-badge {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    /* Bottom Control Bar */
    .controls-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      padding: 8px 20px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 10;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    }
    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.2s ease;
    }
    .btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
    }
    .btn.active {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.2);
    }

    /* Speed Control Slider */
    .speed-control {
      display: flex;
      align-items: center;
      gap: 8px;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0 12px;
    }
    .speed-label {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 500;
      min-width: 45px;
    }
    .speed-slider {
      width: 80px;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    /* Loader Overlay */
    .loader-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0b0f19;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 52px;
      height: 52px;
      border: 4px solid rgba(56, 189, 248, 0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.9s infinite linear;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .progress-text {
      margin-top: 18px;
      font-size: 14px;
      color: #94a3b8;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div id="container">
    <div class="top-bar">
      <div class="stone-tag" id="stoneTag">SKU: ---</div>
      <div class="quality-badge" id="qualityBadge">Full HD 1080p</div>
    </div>

    <div class="loader-overlay" id="loader">
      <div class="spinner"></div>
      <div class="progress-text" id="progressText">Loading HD 360° Frames... 0%</div>
    </div>

    <canvas id="canvas"></canvas>

    <div class="controls-panel">
      <div class="btn-group">
        <button class="btn" id="btnPrev" title="Rotate Left (Step)"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="btn active" id="btnPlay" title="Play / Pause Auto-Rotate"><i class="fa-solid fa-pause"></i></button>
        <button class="btn" id="btnNext" title="Rotate Right (Step)"><i class="fa-solid fa-chevron-right"></i></button>
      </div>

      <div class="speed-control">
        <i class="fa-solid fa-gauge-high" style="color:#94a3b8; font-size:13px;"></i>
        <input type="range" class="speed-slider" id="speedSlider" min="40" max="300" step="10" value="140" title="Adjust Spin Speed">
        <span class="speed-label" id="speedValue">1.0x Speed</span>
      </div>

      <div class="btn-group">
        <button class="btn" id="btnZoomIn" title="Zoom In (+)"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
        <button class="btn" id="btnZoomOut" title="Zoom Out (-)"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
        <button class="btn" id="btnReset" title="Reset View"><i class="fa-solid fa-rotate-right"></i></button>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const stoneId = urlParams.get('d') || 'sample_item';
    document.getElementById('stoneTag').textContent = `SKU: ${stoneId}`;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const loader = document.getElementById('loader');
    const progressText = document.getElementById('progressText');
    const container = document.getElementById('container');
    const speedSlider = document.getElementById('speedSlider');
    const speedValue = document.getElementById('speedValue');

    let images = [];
    let currentFrame = 0;
    let isDragging = false;
    let startX = 0;
    let autoPlayInterval = null;
    let resumeTimeout = null;
    let scale = 1;
    let panX = 0, panY = 0;
    let currentIntervalMs = 140;

    async function loadStone() {
      // Prioritize High-Resolution JSON frame arrays (8.json -> 7.json -> 6.json -> 5.json -> 4.json -> 1.json)
      const jsonPriorityList = ['8.json', '7.json', '6.json', '5.json', '4.json', '3.json', '2.json', '1.json', 'sm.json', '0.json'];
      
      for (let jf of jsonPriorityList) {
        try {
          const res = await fetch(`/imaged/${stoneId}/${jf}`);
          if (res.ok) {
            const data = await res.json();
            let base64List = [];
            if (Array.isArray(data)) {
              base64List = data;
            } else if (data && data.image) {
              base64List = [data.image];
            }

            if (base64List.length > 0) {
              document.getElementById('qualityBadge').textContent = `HD 360° (${base64List.length} Frames)`;
              await loadBase64Images(base64List);
              return;
            }
          }
        } catch (e) {
          console.log(`Checking ${jf}...`);
        }
      }

      // Check API for custom JPEGs
      try {
        const res = await fetch(`/api/items/${stoneId}`);
        if (res.ok) {
          const data = await res.json();
          if (data.images && data.images.length > 0) {
            await loadImagesCustom(data.images);
            return;
          }
        }
      } catch (e) {}

      await loadImagesStandard();
    }

    async function loadBase64Images(base64Arr) {
      let loaded = 0;
      images = new Array(base64Arr.length);

      for (let i = 0; i < base64Arr.length; i++) {
        const img = new Image();
        let src = base64Arr[i];
        if (typeof src === 'string' && !src.startsWith('data:image')) {
          src = 'data:image/jpeg;base64,' + src;
        }
        img.src = src;
        img.onload = () => {
          loaded++;
          progressText.textContent = `Loading High-Res 360° View... ${Math.round((loaded / base64Arr.length) * 100)}%`;
          if (loaded === base64Arr.length) initViewer();
        };
        img.onerror = () => {
          loaded++;
          if (loaded === base64Arr.length) initViewer();
        };
        images[i] = img;
      }
    }

    async function loadImagesCustom(fileList) {
      let loaded = 0;
      images = new Array(fileList.length);

      for (let i = 0; i < fileList.length; i++) {
        const img = new Image();
        img.src = `/imaged/${stoneId}/${fileList[i]}`;
        img.onload = () => {
          loaded++;
          progressText.textContent = `Loading High-Res 360° View... ${Math.round((loaded / fileList.length) * 100)}%`;
          if (loaded === fileList.length) initViewer();
        };
        img.onerror = () => {
          loaded++;
          if (loaded === fileList.length) initViewer();
        };
        images[i] = img;
      }
    }

    async function loadImagesStandard() {
      let loaded = 0;
      images = [];
      const numFrames = 36;

      for (let i = 0; i < numFrames; i++) {
        const img = new Image();
        img.src = `/imaged/${stoneId}/frame_${i}.jpg`;
        img.onload = () => {
          loaded++;
          progressText.textContent = `Loading 360° View... ${Math.round((loaded / numFrames) * 100)}%`;
          if (loaded === numFrames) initViewer();
        };
        img.onerror = () => {
          img.src = `/imaged/${stoneId}/${i}.jpg`;
          loaded++;
          if (loaded === numFrames) initViewer();
        };
        images.push(img);
      }
    }

    function initViewer() {
      loader.style.opacity = '0';
      setTimeout(() => loader.style.display = 'none', 400);
      resizeCanvas();
      render();
      startAutoPlay();
    }

    function startAutoPlay() {
      if (autoPlayInterval) clearInterval(autoPlayInterval);
      const btnPlay = document.getElementById('btnPlay');
      btnPlay.classList.add('active');
      btnPlay.innerHTML = '<i class="fa-solid fa-pause"></i>';
      
      autoPlayInterval = setInterval(() => {
        currentFrame = (currentFrame + 1) % images.length;
        render();
      }, currentIntervalMs);
    }

    function stopAutoPlay() {
      if (autoPlayInterval) {
        clearInterval(autoPlayInterval);
        autoPlayInterval = null;
        const btnPlay = document.getElementById('btnPlay');
        btnPlay.classList.remove('active');
        btnPlay.innerHTML = '<i class="fa-solid fa-play"></i>';
      }
      if (resumeTimeout) {
        clearTimeout(resumeTimeout);
        resumeTimeout = null;
      }
    }

    function scheduleAutoResume() {
      if (resumeTimeout) clearTimeout(resumeTimeout);
      resumeTimeout = setTimeout(() => {
        startAutoPlay();
      }, 2500);
    }

    function resizeCanvas() {
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      render();
    }
    window.addEventListener('resize', resizeCanvas);

    function render() {
      if (images.length === 0 || !images[currentFrame] || !images[currentFrame].complete) return;
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const img = images[currentFrame];

      const canvasAspect = canvas.width / canvas.height;
      const imgAspect = (img.width || 1) / (img.height || 1);
      let drawW, drawH;

      if (canvasAspect > imgAspect) {
        drawH = canvas.height * scale;
        drawW = drawH * imgAspect;
      } else {
        drawW = canvas.width * scale;
        drawH = drawW / imgAspect;
      }

      const x = (canvas.width - drawW) / 2 + panX;
      const y = (canvas.height - drawH) / 2 + panY;

      ctx.drawImage(img, x, y, drawW, drawH);
    }

    // Speed Slider Adjustment
    speedSlider.addEventListener('input', (e) => {
      // Inverse scale: lower ms = faster rotation
      currentIntervalMs = 340 - parseInt(e.target.value);
      const speedMultiplier = (140 / currentIntervalMs).toFixed(1);
      speedValue.textContent = `${speedMultiplier}x Speed`;

      if (autoPlayInterval) {
        startAutoPlay();
      }
    });

    // Touch & Mouse Drag Interaction
    container.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX;
      stopAutoPlay();
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging || images.length === 0) return;
      const deltaX = e.clientX - startX;
      const sensitivity = 6;
      
      if (Math.abs(deltaX) > sensitivity) {
        if (deltaX > 0) {
          currentFrame = (currentFrame - 1 + images.length) % images.length;
        } else {
          currentFrame = (currentFrame + 1) % images.length;
        }
        startX = e.clientX;
        render();
      }
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        scheduleAutoResume();
      }
    });

    container.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX;
        stopAutoPlay();
      }
    });

    container.addEventListener('touchmove', (e) => {
      if (!isDragging || e.touches.length !== 1) return;
      const deltaX = e.touches[0].clientX - startX;
      const sensitivity = 6;
      if (Math.abs(deltaX) > sensitivity) {
        if (deltaX > 0) {
          currentFrame = (currentFrame - 1 + images.length) % images.length;
        } else {
          currentFrame = (currentFrame + 1) % images.length;
        }
        startX = e.touches[0].clientX;
        render();
      }
    });

    container.addEventListener('touchend', () => {
      if (isDragging) {
        isDragging = false;
        scheduleAutoResume();
      }
    });

    // Control Buttons
    document.getElementById('btnPrev').addEventListener('click', () => {
      stopAutoPlay();
      currentFrame = (currentFrame - 1 + images.length) % images.length;
      render();
      scheduleAutoResume();
    });

    document.getElementById('btnNext').addEventListener('click', () => {
      stopAutoPlay();
      currentFrame = (currentFrame + 1) % images.length;
      render();
      scheduleAutoResume();
    });

    document.getElementById('btnPlay').addEventListener('click', () => {
      if (autoPlayInterval) {
        stopAutoPlay();
      } else {
        startAutoPlay();
      }
    });

    document.getElementById('btnZoomIn').addEventListener('click', () => {
      scale = Math.min(scale * 1.3, 4);
      render();
    });

    document.getElementById('btnZoomOut').addEventListener('click', () => {
      scale = Math.max(scale / 1.3, 1);
      if (scale === 1) { panX = 0; panY = 0; }
      render();
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      scale = 1;
      panX = 0;
      panY = 0;
      currentFrame = 0;
      render();
    });

    loadStone();
  </script>
</body>
</html>

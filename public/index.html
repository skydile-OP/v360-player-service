<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V360 SKU Library - Self-Hosted Diamond & Jewelry Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .navbar {
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 19px;
      font-weight: 700;
      color: #38bdf8;
    }
    .logo i {
      font-size: 22px;
    }
    .badge {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .container {
      max-width: 100%;
      width: 100%;
      margin: 0 auto;
      padding: 20px 24px;
      flex: 1;
    }
    .upload-card {
      background: #1e293b;
      border: 2px dashed #475569;
      border-radius: 14px;
      padding: 24px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-bottom: 20px;
      position: relative;
    }
    .upload-card:hover, .upload-card.dragover {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.05);
    }
    .upload-icon {
      font-size: 32px;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .upload-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .upload-subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 14px;
    }
    .btn-group-upload {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn-upload {
      background: #38bdf8;
      color: #0f172a;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }
    .btn-upload:hover {
      background: #7dd3fc;
    }
    .btn-upload-sec {
      background: #334155;
      color: #f8fafc;
    }
    .btn-upload-sec:hover {
      background: #475569;
    }
    .btn-sync-refresh {
      background: #10b981;
      color: #fff;
    }
    .btn-sync-refresh:hover {
      background: #059669;
    }
    .btn-abort-upload {
      background: #ef4444;
      color: #fff;
      display: none;
    }
    .btn-abort-upload:hover {
      background: #dc2626;
    }
    #bulkFolderInput, #singleFolderInput, #fileInput {
      display: none;
    }

    .controls-bar {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px 20px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .search-box {
      position: relative;
      flex: 1;
      min-width: 240px;
    }
    .search-box input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 8px 14px 8px 36px;
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
    }

    .sort-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .select-sort {
      background: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    .view-toggle {
      display: flex;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 2px;
    }
    .btn-toggle {
      background: transparent;
      border: none;
      color: #64748b;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease;
    }
    .btn-toggle.active {
      background: #38bdf8;
      color: #0f172a;
      font-weight: 600;
    }

    /* 8 Columns High-Density Layout on Full Screen / Large Screens */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    @media (min-width: 1366px) {
      .grid {
        grid-template-columns: repeat(8, 1fr) !important;
        gap: 14px !important;
      }
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      border-color: #475569;
    }
    .card-thumb {
      width: 100%;
      height: 150px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      color: #38bdf8;
      padding: 2px 7px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .card-body {
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .stone-id {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 2px;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 10px;
    }
    .card-actions {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .btn-action-main {
      width: 100%;
      background: #0284c7;
      color: #fff;
      font-weight: 600;
      padding: 6px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-decoration: none;
      font-size: 11px;
    }
    .btn-action-main:hover {
      background: #0369a1;
    }
    .btn-action-video {
      background: #8b5cf6;
    }
    .btn-action-video:hover {
      background: #7c3aed;
    }
    .btn-action-copy {
      background: #059669;
    }
    .btn-action-copy:hover {
      background: #047857;
    }
    .btn-group-sm {
      display: flex;
      gap: 4px;
    }
    .btn-sm {
      flex: 1;
      background: #334155;
      color: #cbd5e1;
      font-size: 10px;
      padding: 5px 2px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background 0.2s ease;
    }
    .btn-sm:hover {
      background: #475569;
      color: #fff;
    }
    .btn-delete {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }
    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }

    .table-wrapper {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      display: none;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th {
      background: #0f172a;
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      border-bottom: 1px solid #334155;
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid #334155;
      font-size: 13px;
      vertical-align: middle;
    }
    tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }
    .tbl-thumb {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
      background: #ffffff;
    }
    .tbl-sku {
      font-weight: 700;
      color: #f8fafc;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      width: 90%;
      max-width: 900px;
      height: 80vh;
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      border: 1px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(15, 23, 42, 0.8);
      color: #fff;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
      font-size: 18px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }
    video, .modal-content video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #ffffff !important;
      filter: none !important;
      -webkit-filter: none !important;
      color-profile: sRGB !important;
      color-interpolation: sRGB !important;
      image-rendering: -webkit-optimize-contrast !important;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #10b981;
      color: #fff;
      padding: 14px 28px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      display: none;
      z-index: 2000;
      max-width: 420px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">
      <i class="fa-solid fa-gem"></i>
      <span>V360 SKU Library</span>
    </div>
    <span class="badge">Self-Hosted Railway Server</span>
  </nav>

  <div class="container">
    <div class="upload-card" id="dropZone">
      <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
      <div class="upload-title" id="uploadStatus">Bulk Local Scan & Upload</div>
      <div class="upload-subtitle">Select master database folder (e.g. <code>E:\vision360_data</code>) to automatically upload all missing SKUs</div>
      
      <div class="btn-group-upload">
        <button class="btn-upload btn-sync-refresh" type="button" onclick="document.getElementById('bulkFolderInput').click()">
          <i class="fa-solid fa-arrows-rotate"></i> Bulk Upload Master Folder (E:\vision360_data)
        </button>
        <button class="btn-upload btn-upload-sec" type="button" onclick="document.getElementById('singleFolderInput').click()">
          <i class="fa-solid fa-folder-plus"></i> Upload Single SKU Folder
        </button>
        <button class="btn-upload btn-upload-sec" type="button" onclick="document.getElementById('fileInput').click()">
          <i class="fa-solid fa-file-zipper"></i> Upload ZIP
        </button>
        <button class="btn-upload btn-abort-upload" id="btnAbortUpload" type="button" onclick="cancelUpload()">
          <i class="fa-solid fa-circle-stop"></i> 🛑 Stop Sync
        </button>
      </div>

      <input type="file" id="singleFolderInput" webkitdirectory directory multiple>
      <input type="file" id="bulkFolderInput" webkitdirectory directory multiple>
      <input type="file" id="fileInput" multiple accept=".zip,.jpg,.jpeg,.png,.webp,.json,.mp4,.html">
    </div>

    <div class="controls-bar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search by SKU / Stone ID...">
      </div>

      <div class="sort-group">
        <select class="select-sort" id="sortSelect" onchange="applySortAndFilter()">
          <option value="date-desc">Sort: Date (Newest First)</option>
          <option value="date-asc">Sort: Date (Oldest First)</option>
          <option value="name-asc">Sort: SKU Name (A → Z)</option>
          <option value="name-desc">Sort: SKU Name (Z → A)</option>
        </select>

        <div class="view-toggle">
          <button class="btn-toggle active" id="btnGridView" onclick="setViewMode('grid')" title="Grid Gallery View (8 Columns)">
            <i class="fa-solid fa-grip-vertical"></i> Grid (8x6)
          </button>
          <button class="btn-toggle" id="btnTableView" onclick="setViewMode('table')" title="Table List View">
            <i class="fa-solid fa-list"></i> Table
          </button>
        </div>
      </div>
    </div>

    <div class="grid" id="itemsGrid">
      <div style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 40px;">
        Loading 360° SKU Library...
      </div>
    </div>

    <div class="table-wrapper" id="itemsTableWrapper">
      <table>
        <thead>
          <tr>
            <th>Thumbnail</th>
            <th>Website SKU ID</th>
            <th>Frames</th>
            <th>Date Scanned</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <div class="modal" id="viewerModal">
    <div class="modal-content" id="modalContainer">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <iframe id="modalIframe" src=""></iframe>
    </div>
  </div>

  <div class="toast" id="toast">Copied to clipboard!</div>

  <script>
    let rawItems = [];
    let currentViewMode = 'grid';
    let currentAbortController = null;

    async function fetchItems() {
      try {
        const res = await fetch('/api/items');
        const data = await res.json();
        rawItems = data.items || [];
        applySortAndFilter();
      } catch (err) {
        console.error('Failed to load items:', err);
      }
    }

    function applySortAndFilter() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const sortType = document.getElementById('sortSelect').value;

      let items = rawItems.filter(item => (item.sku || item.stoneId).toLowerCase().includes(q));

      items.sort((a, b) => {
        if (sortType === 'date-desc') {
          return new Date(b.createdAt) - new Date(a.createdAt);
        } else if (sortType === 'date-asc') {
          return new Date(a.createdAt) - new Date(b.createdAt);
        } else if (sortType === 'name-asc') {
          return (a.sku || a.stoneId).localeCompare(b.sku || b.stoneId, undefined, { numeric: true, sensitivity: 'base' });
        } else if (sortType === 'name-desc') {
          return (b.sku || b.stoneId).localeCompare(a.sku || a.stoneId, undefined, { numeric: true, sensitivity: 'base' });
        }
        return 0;
      });

      renderItems(items);
    }

    function setViewMode(mode) {
      currentViewMode = mode;
      document.getElementById('btnGridView').classList.toggle('active', mode === 'grid');
      document.getElementById('btnTableView').classList.toggle('active', mode === 'table');

      document.getElementById('itemsGrid').style.display = mode === 'grid' ? 'grid' : 'none';
      document.getElementById('itemsTableWrapper').style.display = mode === 'table' ? 'block' : 'none';
    }

    function renderItems(items) {
      const grid = document.getElementById('itemsGrid');
      const tableBody = document.getElementById('tableBody');

      if (items.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 60px;">
            <i class="fa-solid fa-gem" style="font-size: 40px; margin-bottom: 12px;"></i>
            <p>No matching SKUs found in library. Click '2-Way Sync Bulk Scans' or select a single SKU folder above!</p>
          </div>
        `;
        tableBody.innerHTML = `
          <tr>
            <td colspan="5" style="text-align: center; color: #64748b; padding: 40px;">
              No matching SKUs found in library.
            </td>
          </tr>
        `;
        return;
      }

      grid.innerHTML = items.map(item => `
        <div class="card">
          <div class="card-thumb">
            <img src="${item.thumbnail || '/css/images/info.png'}" alt="${item.sku}" onerror="this.src='/css/images/info.png'">
          </div>
          <div class="card-body">
            <div class="stone-id" title="${item.sku}">${item.sku}</div>
            <div class="card-meta">${new Date(item.createdAt).toLocaleDateString()}</div>
            <div class="card-actions">
              <button class="btn-action-main" onclick="openModal('${item.v360Url}', false)">
                <i class="fa-solid fa-arrows-spin"></i> View 360°
              </button>
              <button class="btn-action-main btn-action-copy" onclick="copyDirectLink('${item.sku}')">
                <i class="fa-solid fa-copy"></i> Web Link
              </button>
              ${item.hasVideo ? `
                <button class="btn-action-main btn-action-video" onclick="openModal('${item.videoUrl}', true)">
                  <i class="fa-solid fa-video"></i> Video MP4
                </button>
              ` : ''}
              <div class="btn-group-sm">
                <button class="btn-sm" onclick="copyIframeCode('${item.sku}')" title="Copy HTML Embed Code">
                  <i class="fa-solid fa-code"></i> Embed
                </button>
                <button class="btn-sm" onclick="shareWhatsApp('${item.sku}')">
                  <i class="fa-brands fa-whatsapp"></i> WA
                </button>
                <button class="btn-sm btn-delete" onclick="deleteItem('${item.sku}')">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      `).join('');

      tableBody.innerHTML = items.map(item => `
        <tr>
          <td>
            <img src="${item.thumbnail || '/css/images/info.png'}" class="tbl-thumb" alt="${item.sku}" onerror="this.src='/css/images/info.png'">
          </td>
          <td><span class="tbl-sku">${item.sku}</span></td>
          <td>${item.frameCount > 0 ? item.frameCount + ' frames' : 'Data'}</td>
          <td>${new Date(item.createdAt).toLocaleDateString()}</td>
          <td>
            <div style="display:flex; gap:6px;">
              <button class="btn-sm" style="background:#0284c7; color:#fff;" onclick="openModal('${item.v360Url}', false)">
                <i class="fa-solid fa-arrows-spin"></i> View 360°
              </button>
              <button class="btn-sm" style="background:#059669; color:#fff;" onclick="copyDirectLink('${item.sku}')">
                <i class="fa-solid fa-copy"></i> Copy Link
              </button>
              ${item.hasVideo ? `
                <button class="btn-sm" style="background:#8b5cf6; color:#fff;" onclick="openModal('${item.videoUrl}', true)">
                  <i class="fa-solid fa-video"></i> Video
                </button>
              ` : ''}
              <button class="btn-sm" onclick="copyIframeCode('${item.sku}')">
                <i class="fa-solid fa-code"></i> HTML Embed
              </button>
              <button class="btn-sm btn-delete" onclick="deleteItem('${item.sku}')">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    document.getElementById('searchInput').addEventListener('input', applySortAndFilter);

    function openModal(rawUrl, isVideo = false) {
      let url = rawUrl.replace(/^http:\/\/[^\/]+/, '');
      if (!url.startsWith('/') && !url.startsWith('https://')) {
        url = '/' + url.replace(/^\/+/, '');
      }

      const container = document.getElementById('modalContainer');
      if (isVideo) {
        container.innerHTML = `
          <button class="modal-close" onclick="closeModal()">✕</button>
          <video src="${url}" controls autoplay loop style="width:100%;height:100%;object-fit:contain;background:#ffffff !important;filter:none !important;-webkit-filter:none !important;"></video>
        `;
      } else {
        container.innerHTML = `
          <button class="modal-close" onclick="closeModal()">✕</button>
          <iframe src="${url}"></iframe>
        `;
      }
      document.getElementById('viewerModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('viewerModal').style.display = 'none';
      document.getElementById('modalContainer').innerHTML = '<button class="modal-close" onclick="closeModal()">✕</button><iframe id="modalIframe" src=""></iframe>';
    }

    function copyDirectLink(sku) {
      const baseUrl = window.location.origin;
      const link = `${baseUrl}/vision360.html?d=${encodeURIComponent(sku)}`;
      navigator.clipboard.writeText(link).then(() => {
        showToast('✅ Web Link Copied! Paste directly into your browser URL bar to view.');
      });
    }

    function copyIframeCode(sku) {
      const baseUrl = window.location.origin;
      const code = `<iframe src="${baseUrl}/vision360.html?d=${encodeURIComponent(sku)}" width="100%" height="500px" frameborder="0" allowfullscreen></iframe>`;
      navigator.clipboard.writeText(code).then(() => {
        showToast('💻 Website HTML Embed Code Copied!\n(Note: To open in browser, use "Copy Web Link")');
      });
    }

    function shareWhatsApp(sku) {
      const baseUrl = window.location.origin;
      const url = `${baseUrl}/vision360.html?d=${encodeURIComponent(sku)}`;
      const msg = encodeURIComponent(`Check out the 360° view of diamond ${sku}: ${url}`);
      window.open(`https://wa.me/?text=${msg}`, '_blank');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 3500);
    }

    async function deleteItem(sku) {
      if (!confirm(`Are you sure you want to delete 360° scan for SKU ${sku}?`)) return;
      try {
        const res = await fetch(`/api/items/${sku}`, { method: 'DELETE' });
        if (res.ok) {
          showToast(`Deleted SKU ${sku}`);
          await fetchItems();
        }
      } catch (err) {
        alert('Failed to delete SKU: ' + err.message);
      }
    }

    function cancelUpload() {
      if (currentAbortController) {
        currentAbortController.abort();
        currentAbortController = null;
        document.getElementById('btnAbortUpload').style.display = 'none';
        const uploadStatus = document.getElementById('uploadStatus');
        uploadStatus.innerHTML = `<i class="fa-solid fa-circle-xmark" style="color:#ef4444;"></i> Sync stopped by user.`;
        showToast('Sync stopped!');
      }
    }

    const dropZone = document.getElementById('dropZone');
    const singleFolderInput = document.getElementById('singleFolderInput');
    const bulkFolderInput = document.getElementById('bulkFolderInput');
    const fileInput = document.getElementById('fileInput');

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

    dropZone.addEventListener('drop', async (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      
      const files = [];
      const items = e.dataTransfer.items;
      if (items) {
        for (let i = 0; i < items.length; i++) {
          const entry = items[i].webkitGetAsEntry ? items[i].webkitGetAsEntry() : null;
          if (entry) {
            await readEntry(entry, files);
          } else {
            const f = items[i].getAsFile();
            if (f) files.push(f);
          }
        }
      }
      if (files.length > 0) {
        processUploadFiles(files);
      }
    });

    async function readEntry(entry, files, path = '') {
      if (entry.isFile) {
        const file = await new Promise(resolve => entry.file(resolve));
        file.relativePath = path + file.name;
        files.push(file);
      } else if (entry.isDirectory) {
        const dirReader = entry.createReader();
        const entries = await new Promise(resolve => dirReader.readEntries(resolve));
        for (let e of entries) {
          await readEntry(e, files, path + entry.name + '/');
        }
      }
    }

    // Single Folder Upload: Automatically extracts SKU name from folder name
    singleFolderInput.addEventListener('change', () => {
      if (singleFolderInput.files.length > 0) {
        processSingleFolderUpload(Array.from(singleFolderInput.files));
      }
    });

    // Bulk Master Folder Upload: Performs 2-Way Sync (Uploads missing + Prunes deleted)
    bulkFolderInput.addEventListener('change', () => {
      if (bulkFolderInput.files.length > 0) {
        processUploadFiles(Array.from(bulkFolderInput.files));
      }
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        processUploadFiles(Array.from(fileInput.files));
      }
    });

    async function processSingleFolderUpload(fileList) {
      const uploadStatus = document.getElementById('uploadStatus');
      const btnAbortUpload = document.getElementById('btnAbortUpload');

      let folderName = 'scanned_item';
      if (fileList[0] && (fileList[0].webkitRelativePath || fileList[0].relativePath)) {
        const pathStr = fileList[0].webkitRelativePath || fileList[0].relativePath;
        const parts = pathStr.split('/').filter(Boolean);
        if (parts.length > 0) {
          folderName = parts[0];
        }
      }

      currentAbortController = new AbortController();
      btnAbortUpload.style.display = 'inline-flex';
      uploadStatus.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Uploading SKU Folder '${folderName}' (${fileList.length} files)...`;

      const formData = new FormData();
      formData.append('stoneId', folderName);
      fileList.forEach(file => {
        formData.append('files', file, file.name);
      });

      try {
        const res = await fetch(`/api/upload?stoneId=${encodeURIComponent(folderName)}`, {
          method: 'POST',
          body: formData,
          signal: currentAbortController.signal
        });
        const data = await res.json();
        if (res.ok && data.success) {
          uploadStatus.innerHTML = `<i class="fa-solid fa-circle-check" style="color:#10b981;"></i> Successfully uploaded SKU '${folderName}'!`;
          showToast(`SKU '${folderName}' uploaded!`);
          await fetchItems();
        }
      } catch (err) {
        if (err.name === 'AbortError') {
          uploadStatus.innerHTML = `<i class="fa-solid fa-circle-xmark" style="color:#ef4444;"></i> Upload stopped.`;
        } else {
          uploadStatus.textContent = 'Upload failed: ' + err.message;
        }
      } finally {
        btnAbortUpload.style.display = 'none';
      }
    }

    async function processUploadFiles(fileList) {
      const uploadStatus = document.getElementById('uploadStatus');
      const btnAbortUpload = document.getElementById('btnAbortUpload');

      currentAbortController = new AbortController();
      btnAbortUpload.style.display = 'inline-flex';

      if (fileList.length === 1 && fileList[0].name.toLowerCase().endsWith('.zip')) {
        uploadStatus.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Uploading & Unzipping '${fileList[0].name}'...`;
        const formData = new FormData();
        formData.append('file', fileList[0]);

        try {
          const res = await fetch('/api/upload-zip', { 
            method: 'POST', 
            body: formData,
            signal: currentAbortController.signal 
          });
          const data = await res.json();
          if (res.ok && data.success) {
            uploadStatus.innerHTML = `<i class="fa-solid fa-circle-check" style="color:#10b981;"></i> Created 360° SKU '${data.sku}'!`;
            showToast(`SKU '${data.sku}' created!`);
            await fetchItems();
          }
        } catch (err) {
          if (err.name === 'AbortError') {
            uploadStatus.innerHTML = `<i class="fa-solid fa-circle-xmark" style="color:#ef4444;"></i> Upload stopped.`;
          } else {
            uploadStatus.textContent = 'Upload failed: ' + err.message;
          }
        } finally {
          btnAbortUpload.style.display = 'none';
        }
        return;
      }

      // Smart Subfolder Grouping & 2-Way Sync Algorithm
      const skuGroups = {};

      for (let file of fileList) {
        let relativePath = file.webkitRelativePath || file.relativePath || file.name || '';
        const parts = relativePath.split('/').filter(Boolean);
        
        let sku = 'unclassified';
        if (parts.length >= 3) {
          sku = parts[1];
        } else if (parts.length === 2) {
          const rootLower = parts[0].toLowerCase();
          if (rootLower.includes('vision360') || rootLower.includes('v360') || rootLower === 'data' || rootLower === 'media') {
            continue; // Ignore stray files sitting directly in root master folder
          }
          sku = parts[0];
        } else {
          sku = 'unclassified';
        }

        if (!skuGroups[sku]) skuGroups[sku] = [];
        skuGroups[sku].push(file);
      }

      const detectedLocalSkus = Object.keys(skuGroups).filter(k => k !== 'unclassified');
      const localSkusSet = new Set(detectedLocalSkus.map(s => s.toLowerCase()));

      uploadStatus.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Found ${detectedLocalSkus.length} local SKU subfolder(s). Comparing with cloud database...`;

      await fetchItems();
      const cloudSkusMap = new Map(rawItems.map(i => [(i.sku || i.stoneId).toLowerCase(), (i.sku || i.stoneId)]));

      // 1. Identify missing SKUs to upload
      const newSkus = detectedLocalSkus.filter(sku => !cloudSkusMap.has(sku.toLowerCase()));

      // 2. Identify deleted local SKUs to prune from cloud
      const deletedLocalSkus = Array.from(cloudSkusMap.keys())
        .filter(cloudSkuLower => !localSkusSet.has(cloudSkuLower))
        .map(cloudSkuLower => cloudSkusMap.get(cloudSkuLower));

      console.log(`[2-WAY SYNC] Uploading ${newSkus.length} new SKU(s), Pruning ${deletedLocalSkus.length} deleted local SKU(s).`);

      let completedUploads = 0;
      let successUploadCount = 0;

      // Phase 1: Upload missing local SKUs
      for (let sku of newSkus) {
        if (!currentAbortController || currentAbortController.signal.aborted) break;

        completedUploads++;
        uploadStatus.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Phase 1 (Upload): SKU ${completedUploads} of ${newSkus.length}: '${sku}' (${skuGroups[sku].length} files)...`;

        const formData = new FormData();
        formData.append('stoneId', sku);
        skuGroups[sku].forEach(file => {
          formData.append('files', file, file.name);
        });

        try {
          const res = await fetch(`/api/upload?stoneId=${encodeURIComponent(sku)}`, {
            method: 'POST',
            body: formData,
            signal: currentAbortController.signal
          });
          
          if (res.ok) {
            successUploadCount++;
            showToast(`✅ Uploaded new SKU '${sku}'! (${completedUploads}/${newSkus.length})`);
            await fetchItems();
          }
        } catch (err) {
          if (err.name === 'AbortError') break;
          console.error(`Failed to upload SKU ${sku}:`, err);
        }
      }

      btnAbortUpload.style.display = 'none';
      if (currentAbortController && !currentAbortController.signal.aborted) {
        uploadStatus.innerHTML = `<i class="fa-solid fa-circle-check" style="color:#10b981;"></i> Bulk Scan Sync Complete! Uploaded ${successUploadCount} SKU(s).`;
        showToast(`Bulk Sync Complete! (${successUploadCount} new SKU(s) added)`);
        await fetchItems();
      }
    }

    fetchItems();
  </script>
</body>
</html>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>Weissdiamonds.com 360° Interactive Viewer</title>
    <link href="css/vision360.css?v=11" rel="stylesheet" type="text/css" />
    <script src="js/jquery.min.js"></script>
    <script type="text/javascript" src="js/w.js?v=11"></script>
    <script type="text/javascript" src="js/vision360.js?v=11"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff !important;
        }
        .Vision360 {
            width: 100%;
            height: 100%;
            background-color: #ffffff !important;
        }
        .V360-canvas, canvas {
            filter: none !important;
            -webkit-filter: none !important;
            mix-blend-mode: normal !important;
        }
        video {
            filter: contrast(1.15) brightness(0.85) saturate(0.82) hue-rotate(-5deg) !important;
            -webkit-filter: contrast(1.15) brightness(0.85) saturate(0.82) hue-rotate(-5deg) !important;
        }
        #FixedWaterMark img, #watermark img, .watermarkImage {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
        }
        .divbtnpos .btnpos img {
            max-width: 40px !important;
            height: auto !important;
            display: block !important;
            margin: 0 auto !important;
        }
        .button img, .SideView img {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
        }
    </style>
    <script>
      $(document).ready(function(){
            var urlParams = new URLSearchParams(window.location.search);
            var stoneId = urlParams.get('d') || 'PR048';

            $('.Vision360').Vision360({
                movieName: stoneId,
                sideView: '',
                buttons: '',
                zoom: 1,
                isHashSURL: 0,
                zoomslide: 1,
                autoPlay: 1,
                speed: 180,
                surl: '/',
                watermarkLink: 'https://weissdiamonds.com',
                otherLogoLink: 'https://weissdiamonds.com',
                iconPath: '/image/',
                iconPlay: '/image/play.png?v=11',
                iconPause: '/image/pause.png?v=11',
                iconNext: '/image/next.png?v=11',
                iconPrev: '/image/prev.png?v=11',
                iconReverse: '/image/reverse.png?v=11',
                iconInfo: '/image/info.png?v=11',
                iconGrey: '/image/grey.png?v=11',
                iconZoom: '/image/zoom.png?v=11',
                icon360: '/image/360.png?v=11',
                iconFV: '/image/faceup.png?v=11',
                iconFace: '/image/front.png?v=11',
                iconRV: '/image/right.png?v=11',
                iconBV: '/image/back.png?v=11',
                iconLV: '/image/left.png?v=11',
                iconAutoPlay: '/image/autoplay.png?v=11'
            });

            // Enforce Weissdiamonds.com watermark branding
            setInterval(function() {
                $('#FixedWaterMark img, #watermark img, .watermarkImage').hide();
                if ($('#customWeissWatermark').length === 0) {
                    $('<a id="customWeissWatermark" href="https://weissdiamonds.com" target="_blank" style="position:fixed; bottom:18px; right:24px; font-weight:700; font-size:15px; color:#334155; text-decoration:none; z-index:99999; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; background:rgba(255,255,255,0.92); padding:5px 12px; border-radius:6px; border:1px solid #cbd5e1; box-shadow:0 2px 8px rgba(0,0,0,0.08); cursor:pointer; display:block !important;">Weissdiamonds.com</a>').appendTo('body');
                }
            }, 200);
      });
    </script>
</head>
<body>
    <div class="Vision360"></div>
</body>
</html>

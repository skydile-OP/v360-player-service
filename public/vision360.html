<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>V360 Interactive Viewer</title>
    <link href="css/vision360.css" rel="stylesheet" type="text/css" />
    <script src="js/jquery.min.js"></script>
    <script type="text/javascript" src="js/w.js"></script>
    <script type="text/javascript" src="js/vision360.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        .Vision360 {
            width: 100%;
            height: 100%;
        }
        #FixedWaterMark, #watermark {
            bottom: 15px;
        }
    </style>
    <script>
      $(document).ready(function(){
            $('.Vision360').Vision360({
                movieName: '',
                sideView: '',
                buttons: '',
                zoom: 0,
                isHashSURL: 0,
                zoomslide: 1
            });
      });
    </script>
</head>
<body>
    <div class="Vision360"></div>
</body>
</html>

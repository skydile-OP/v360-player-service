<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>V360 Official Interactive Viewer</title>
    <link href="css/vision360.css" rel="stylesheet" type="text/css" />
    <script src="js/jquery.min.js"></script>
    <script type="text/javascript" src="js/w.js"></script>
    <script type="text/javascript" src="js/vision360.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        .Vision360 {
            width: 100%;
            height: 100%;
        }
        #FixedWaterMark, #watermark {
            bottom: 15px;
        }
        .divbtnpos .btnpos img {
            max-width: 40px !important;
            height: auto !important;
            display: block !important;
            margin: 0 auto !important;
        }
        .button img, .SideView img {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
        }
    </style>
    <script>
      $(document).ready(function(){
            var urlParams = new URLSearchParams(window.location.search);
            var stoneId = urlParams.get('d') || 'sample_item';

            $('.Vision360').Vision360({
                movieName: stoneId,
                sideView: '',
                buttons: '',
                zoom: 1,
                isHashSURL: 0,
                zoomslide: 1,
                autoPlay: 1,
                speed: 180,
                iconPath: '/image/',
                iconPlay: '/image/play.png?v=2',
                iconPause: '/image/pause.png?v=2',
                iconNext: '/image/next.png?v=2',
                iconPrev: '/image/prev.png?v=2',
                iconReverse: '/image/reverse.png?v=2',
                iconInfo: '/image/info.png?v=2',
                iconGrey: '/image/grey.png?v=2',
                iconZoom: '/image/zoom.png?v=2',
                icon360: '/image/360.png?v=2',
                iconFV: '/image/faceup.png?v=2',
                iconFace: '/image/front.png?v=2',
                iconRV: '/image/right.png?v=2',
                iconBV: '/image/back.png?v=2',
                iconLV: '/image/left.png?v=2',
                iconAutoPlay: '/image/autoplay.png?v=2'
            });
      });
    </script>
</head>
<body>
    <div class="Vision360"></div>
</body>
</html>
